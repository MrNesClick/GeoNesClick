# Builds the AppImage and publishes the GitHub release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Runs on Ubuntu 24.04, the oldest target (what is compiled there works on the later versions). The tag must match
# the version of the four manifests; the tests must pass before anything is built. Actions are pinned to a commit,
# not a tag (a tag can be moved), and the job only gets the right to write the release. It waits for the repository
# owner's approval (environment "release", limited to v* tags): a pushed tag alone never publishes anything.
name: Release
run-name: Release ${{ github.ref_name }}  # otherwise the run is named after the tagged commit's message

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write  # create the release and upload the AppImage
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"  # linuxdeploy is an AppImage itself: no FUSE on the runners
      UV_HTTP_RETRIES: "10"  # Python comes from GitHub releases, which answered 504 for minutes (default: 3 tries)
    steps:
      # The runner image leaves too little room for the engine venv (CUDA torch) and the Rust build: the disk was at
      # 97% before the AppImage step of v0.1.0. None of these preinstalled SDKs is used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the previous tags, for the version check

      - name: Tag matches the version of every manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for found in \
            "$(grep -m1 '^version' engine/pyproject.toml | cut -d'"' -f2)" \
            "$(grep -m1 '"version"' app/package.json | cut -d'"' -f4)" \
            "$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)" \
            "$(grep -m1 '"version"' app/src-tauri/tauri.conf.json | cut -d'"' -f4)"; do
            if [ "$found" != "$tag" ]; then
              echo "::error::tag v$tag but a manifest says $found"
              exit 1
            fi
          done

      # Checked before the build: a release is never published without its section in CHANGELOG.md.
      - name: CHANGELOG.md describes the version
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      # Strict SemVer against the previous tag and the version's CHANGELOG section (CLAUDE.md › Versions).
      - name: The version number follows SemVer
        run: python3 scripts/check-version.py "${GITHUB_REF_NAME#v}"

      # Same versions as the machine where the AppImage was built and tested.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: "11.8.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: "1.95.0"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.9.17"

      - name: Dependencies (system packages, engine venv, front end)
        run: scripts/install.sh --with-apt

      - name: Tests
        run: |
          (cd engine && .venv/bin/python -m pytest -q)
          (cd app && pnpm exec vue-tsc --noEmit)
          (cd app/src-tauri && cargo test --lib)

      # The interface in WebKit (the engine of the Tauri window), with the Rust side and the engine simulated.
      - name: Interface tests
        run: |
          cd app
          pnpm exec playwright install --with-deps webkit
          pnpm exec playwright test

      - name: AppImage
        run: |
          df -h /
          scripts/build-appimage.sh
          df -h /  # after the Rust build and the bundling: the real minimum of free space

      # The engine bundle just built, installed as the AppImage's installer does on six systems (Docker containers):
      # system components under the installer's package names, install-engine.sh, then a StreetCLIP analysis.
      - name: Engine installation on six systems
        run: |
          python3 scripts/test-install.py --remove-images
          df -h /

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}  # this repository's token on the runner, valid for this job only
        run: |
          cd app/src-tauri/target/release/bundle/appimage
          appimage="$(ls GeoNesClick_*.AppImage)"
          sha256sum "$appimage" > "$appimage.sha256"
          # What changes in this version (CHANGELOG.md), then what every release says.
          "$GITHUB_WORKSPACE/scripts/release-notes.sh" "${GITHUB_REF_NAME#v}" > notes.md
          cat >> notes.md <<EOF

          ---

          AI-assisted geolocation coach to train at GeoGuessr and at the basics of image geolocation (OSINT), for 64-bit Linux with GNOME (tested on Ubuntu 24.04 and 26.04).

          **Install**: download \`$appimage\`, make it executable, open it. On first launch, an installer lists
          everything it will download (about 5 GB with an NVIDIA card) before installing the engine in
          \`~/.local/share/geonesclick/\`. See the [README](https://github.com/${GITHUB_REPOSITORY}#install).

          **Check the download**: \`sha256sum -c $appimage.sha256\`

          Code under Apache-2.0. The StreetCLIP model is under CC BY-NC 4.0: no commercial use.
          EOF
          gh release create "$GITHUB_REF_NAME" "$appimage" "$appimage.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "GeoNesClick ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
