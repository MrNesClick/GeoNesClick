[project]
name = "geonesclick"
version = "0.3.1"
description = "Moteur de GeoNesClick : capture, IA locale et distante, règles locales, metas"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "MrNesClick", email = "contact@mrnesclick.fr" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "pygobject>=3.58.1",
    "tomlkit==0.15.2",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
