# Everything GeoNesClick downloads or sends over the network: the single list, shown by the first-launch
# flow BEFORE a single byte, and repeated in the README (decided with the user on 2026-11-07: "100 %
# transparent, state CLEARLY everything we download"). A test (tests/test_downloads.py) checks that every
# address written in the code is listed here, whether contacted or only displayed.
#
# when: installation (once, on first launch) · option (once, if you accept it) · on_demand (during use, when
#        useful) · continuous (on every use of the feature)
# required: without it, the app does not work ("required" block of the flow, a single consent)
# The texts shown (what, why, what is sent) are in the catalogs, locales/<lang>.json: download.<id>.what, .why,
# .sends (and .license when it is a sentence).
# Sizes measured on 2026-11-07 (Python packages: computed from uv.lock when building the AppImage).

[[download]]
id = "python"
hosts = ["github.com", "objects.githubusercontent.com"]
size_mb = 30
license = "PSF-2.0"
when = "installation"
required = true

[[download]]
id = "packages"
hosts = ["pypi.org", "files.pythonhosted.org"]
size_mb = 3060  # with an NVIDIA card (PyTorch CUDA); without an NVIDIA card, see "pytorch-cpu"
license = "various (BSD, MIT, Apache-2.0…), detailed package by package below"
when = "installation"
required = true

[[download]]
id = "pytorch-cpu"
hosts = ["download.pytorch.org"]
size_mb = 200
license = "BSD-3-Clause"
when = "installation"
required = true

[[download]]
id = "streetclip"
hosts = ["huggingface.co", "cas-bridge.xethub.hf.co", "cdn-lfs.hf.co"]
size_mb = 1712
license = "CC BY-NC 4.0 (non-commercial use)"
when = "installation"
required = true

[[download]]
id = "geonames"
hosts = ["download.geonames.org"]
size_mb = 11
license = "CC BY 4.0 (GeoNames)"
when = "option"
required = false
option = "rules.places"

[[download]]
id = "villages"
hosts = ["download.geonames.org"]
size_mb = 8  # per country: France 7.3 MB, Denmark 1.2 MB
license = "CC BY 4.0 (GeoNames)"
when = "on_demand"
required = false
option = "rules.detail"

[[download]]
id = "plonkit"
hosts = ["www.plonkit.net"]
size_mb = 2
license = "no reuse licence: collected for your personal use, never redistributed"
when = "option"
required = false
option = "plonkit.enabled"

[[download]]
id = "plonk"
hosts = ["huggingface.co", "cas-bridge.xethub.hf.co", "cdn-lfs.hf.co"]
size_mb = 144
license = "MIT"
when = "option"
required = false
option = "plonk.enabled"

[[download]]
id = "nvidia"
hosts = ["integrate.api.nvidia.com"]
size_mb = 0
license = "terms of use of the NVIDIA API (build.nvidia.com); your API key"
when = "continuous"
required = false
option = "vision.enabled"

[[download]]
id = "tiles"
hosts = ["tile.openstreetmap.org"]
size_mb = 0
license = "data © OpenStreetMap contributors (ODbL); OSMF tile usage policy"
when = "continuous"
required = false
option = "map.enabled"

# Addresses written in the code but NEVER contacted by the app: displayed links (sources of a rule,
# attributions, help pages), links you paste (read, never opened), or install.sh development tools.
[shown]
hosts = [
  "en.wikipedia.org",           # source of a rule (alphabets, street words)
  "build.nvidia.com",           # where to get your API key
  "www.openstreetmap.org",      # map attribution
  "operations.osmfoundation.org",  # tile policy (comment)
  "www.geonames.org",           # places attribution
  "www.naturalearthdata.com",   # borders attribution (file shipped with the app)
  "raw.githubusercontent.com",  # origin of the borders file shipped with the app (comment)
  "github.com",                 # PLONK source code (comment)
  "www.google.com",             # Google Maps link you paste into "Where was it?": read, never opened
  "schema.tauri.app", "v2.tauri.app", "pygobject.gnome.org",  # documentation
  "rustup.rs", "nodejs.org", "pnpm.io", "astral.sh",          # development tools (install.sh)
]
