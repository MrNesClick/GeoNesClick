"United Arab Emirates" = "AE"
"United Kingdom" = "GB"
"United States" = "US"
Uruguay = "UY"
Vietnam = "VN"

[plonk]
# Nuage des positions probables de la vue, dessiné sur la carte (niveau 3 et plus). PLONK (MIT) lit le vecteur
# déjà calculé par StreetCLIP : +119 Mo de mémoire vidéo, ~0,75 s en arrière-plan. Il ne sert qu'à la carte :
# mesuré, il ne choisit pas mieux le pays que StreetCLIP. Poids téléchargés une fois (144 Mo).
enabled = true
model = "nicolas-dufour/PLONK_OSV_5M"
revision = "e23229f4dd91d52560e8827f5bb2c68257fa162f"  # version des poids mesurée (README) ; à changer avec model
steps = 50               # pas du flot (10 à 250) : 50 suffisent, en dessous de 25 le nuage se dégrade
points = 512             # points tirés (64 à 2048)
# Zones dessinées sur la carte : contours arrondis autour des points les plus denses du nuage.
zone_share = 0.8         # les zones englobent les 80 % de points les plus denses
zone_link_km = 150       # deux points à moins de 150 km appartiennent à la même zone
zone_min_part = 0.05     # une zone doit réunir au moins 5 % des points pour être montrée

[map]
# Carte du coach, à partir du niveau 3 : pays probables colorés, pays écartés grisés, nuage PLONK.
# Le fond vient d'un serveur de tuiles EN LIGNE : il voit ton adresse IP et les zones affichées. Sans réseau,
# la carte garde les pays et le nuage, sans fond.
enabled = true
# Règles d'OpenStreetMap : https://operations.osmfoundation.org/policies/tiles/ (attribution visible, pas de
# téléchargement à l'avance). Autre serveur : l'autoriser aussi dans la CSP (img-src) de
# app/src-tauri/tauri.conf.json, sinon ses tuiles sont bloquées.
tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = "© OpenStreetMap"
attribution_url = "https://www.openstreetmap.org/copyright"
# Filtre CSS appliqué aux tuiles pour le thème sombre du coach ("" = carte d'origine).
tile_filter = "invert(1) hue-rotate(180deg) saturate(0.35) brightness(0.85) contrast(0.9)"
# De près, l'inversion rend forêts, relief et noms de villages illisibles (constaté le 2026-11-07 au zoom 13, en
# Béarn) : à partir de close_zoom, tuiles d'origine à peine atténuées pour ne pas éblouir ("" = d'origine).
tile_filter_close = "brightness(0.9) contrast(0.95)"
close_zoom = 11
# Zoom maximal (2 à 19). 13 : on voit les rues et les villages autour d'une position estimée d'après tes marques
# (panneau directionnel, ~2 km près). Plus haut : plus de tuiles chargées, et le serveur voit des zones plus précises.
# Les zones PLONK (~100 km) et les pays se cadrent toujours de plus loin (zoom 8 au plus).
max_zoom = 13

[vision]
enabled = true
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVAPI"    # variable lue dans l'environnement ou dans le .env du projet
model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
thinking = false         # raisonnement du modèle : plus lent, pas forcément plus juste
timeout_s = 90
max_tokens = 2000
temperature = 0.2
max_side_px = 1280       # l'image est réduite à cette taille avant l'envoi
# Prompt mesuré : le rallonger dégrade la lecture du texte (2026-11-07, plaque « Repkény utca » : 8 lectures
# sur 10 avec celui-ci, 4 sur 12 avec des consignes en plus sur l'interface du jeu et le texte illisible).
prompt = '''
Tu es l'œil d'un coach GeoGuessr. Décris UNIQUEMENT ce qui est visible dans cette vue Street View.
Ne devine jamais un pays d'après le paysage : seule la clé "conclusion" peut nommer un lieu, et seulement
sur une preuve explicite. Réponds par un objet JSON valide, en français, avec ces clés :
- "sens_circulation": "droite" | "gauche" | "indéterminé" ; ne conclus que sur une preuve forte
  (véhicules EN MOUVEMENT, panneaux orientés, marquage), jamais sur des voitures garées
- "preuve_circulation": la preuve utilisée
- "marquage_routier": lignes (couleur, continues/discontinues, centrales/de rive) ou "aucun"
- "poteaux": matériau, forme, trous, marquages, couleurs
- "bornes_et_glissieres": bornes kilométriques, délinéateurs, glissières
- "panneaux_et_texte": textes lus mot pour mot, alphabet
- "plaques_immatriculation": couleurs, forme, bande latérale
- "architecture": style, toits, matériaux, clôtures
- "vegetation_et_sol": végétation reconnaissable, couleur du sol, climat apparent
- "relief": plat, collines, montagnes
- "camera_et_voiture_google": génération de caméra, partie visible du véhicule, antenne
- "autres_indices": tout autre détail discriminant
- "confiance": "faible" | "moyenne" | "élevée"
- "conclusion": objet {"pays": code ISO 3166-1 à 2 lettres, "region": région, province ou ville,
  "preuve": l'élément exact qui le prouve, "certitude": "forte" | "moyenne"} ; remplis-le UNIQUEMENT si
  un élément explicite désigne le lieu (texte lu nommant un lieu ou une administration, nom de domaine,
  indicatif téléphonique, drapeau, plaque nationale) ; sinon mets "pays": "", "region": "", "preuve": "".
  Un nom de région ne vaut que s'il est lu ; laisse "region" vide s'il n'est pas écrit.
Si un élément n'est pas visible, écris "non visible". N'invente rien.
Ignore l'interface du jeu (boutons, boussole, carte, logos).
'''

[marks]
# Marques : Super+Maj+Z (ou « Marquer ») fige la vue en plein écran ; tu entoures chaque indice (plaque de rue,
# panneau, enseigne…) ; chacun est découpé dans l'image BRUTE, agrandi s'il est petit, puis transcrit par le
# modèle de vision. Les marques complètent l'analyse de la manche : il faut une capture d'abord.
enabled = true
max_marks = 9            # marques par image figée (1 à 20)
# Mesuré (2026-11-07) : panneau roumain de 140×130 px lu déformé tel quel, exact une fois agrandi ×3.
# Le plus grand côté de la découpe est porté à upscale_to_px, sans dépasser max_upscale fois sa taille.
upscale_to_px = 420
max_upscale = 4.0
parallel = 3             # lectures envoyées en même temps (limites du palier gratuit)
model = ""               # vide = le modèle du niveau 2 ([vision] model)
max_tokens = 600
# Le modèle TRANSCRIT seulement : le coach tire les conclusions (règles locales, à venir).
prompt = '''
Cette image est un détail agrandi d'une vue Street View. Recopie mot pour mot tout le texte visible, tel
qu'il est écrit (accents, alphabet, majuscules), sans traduire ni corriger. Réponds par un objet JSON valide :
- "texte": liste des lignes lues ; [] s'il n'y a pas de texte
- "illisible": true si du texte est visible mais pas lisible, sinon false
- "objet": ce que montre l'image, en quelques mots, en français (plaque de rue, panneau, enseigne, plaque d'immatriculation, borne, poteau…)
- "alphabet": latin, cyrillique, grec, arabe, hébreu, thaï, hangeul, kana ou kanji, devanagari, autre, ou "aucun"
N'invente rien et ne nomme aucun pays.
'''

[rules]
# Règles locales : ce que le texte des marques prouve. Le modèle transcrit, le coach conclut, chaque règle sourcée :
# - l'alphabet écarte les pays qui ne l'écrivent pas (du cyrillique exclut la France) ;
# - une lettre ou un mot de rue propre à une langue (« ъ » devant une consonne, « utca ») : pays très probable ;
# - un nom de lieu (GeoNames) : pays certain s'il est confirmé par une autre preuve et qu'aucune marque ne le contredit.
scripts = true
letters = true
places = true
place_min_len = 4        # noms de lieux plus courts ignorés (sigles, mots courants)
# Répertoire GeoNames des localités de plus de 1 000 habitants (CC BY 4.0, ~11 Mo), téléchargé une fois au
# démarrage puis indexé en local (~55 Mo, 2,5 s).
places_url = "https://download.geonames.org/export/dump/cities1000.zip"
places_dir = ""          # vide = ~/.local/share/geonesclick/places
# Les lieux lus pendant une manche sont voisins (un panneau annonce rarement plus loin que 300 km) : un homonyme
# plus éloigné du groupe des autres lieux lus est ignoré. Mesuré : « LAAS », village français absent du
# répertoire, tombait sur Lasa (Italie, ~950 km d'Orthez lu sur la même manche).
place_max_spread_km = 400
# Un lieu SEUL ne conclut pas (mesuré : Gare, Laas, Orion, Manto, quatre fausses pistes en une journée) : il faut
# un 2ᵉ lieu voisin, une lettre ou un mot de la langue du pays, ou StreetCLIP qui donne ce pays à prior_min au moins.
prior_min = 0.10
# Dès qu'un pays mène, son répertoire COMPLET (tous les lieux habités, villages compris) est téléchargé une fois
# (GeoNames : FR 7,3 Mo, IT 4,4 Mo, BG 0,8 Mo) et ajouté. GeoNames voit alors quel pays est consulté.
detail = true
detail_url = "https://download.geonames.org/export/dump/{}.zip"
# Noms des régions (~140 Ko, une fois) : région de chaque lieu, pour le verrou Région. Sans eux, le code s'affiche.
regions_url = "https://download.geonames.org/export/dump/admin1CodesASCII.txt"

[locks]
# Verrous pays › région › ville, en tête du coach : chaque niveau verrouillé restreint la recherche du suivant
# (lieux du pays, villages de la région). Les avis indépendants (StreetCLIP, l'IA) restent affichés, et un désaccord
# est signalé : c'est ce qui révèle un verrou faux. Tu peux toujours rejeter un verrou (✕) ou poser le tien ; le coach
# ne remplace jamais le tien. Ils durent une capture : une nouvelle capture remet tout à zéro.
enabled = true
auto_country = true      # pays verrouillé seul quand tes marques le rendent CERTAIN (jamais sur « très probable »)
# Région verrouillée seule quand la position estimée est un point net (panneau aux distances cohérentes) et que
# tous les lieux à moins de region_radius_km de ce point sont de la même région.
auto_region = true
region_radius_km = 10
# Sans distance lue : au moins deux lieux lus, tous dans la même région et à moins de region_places_km les uns des
# autres (un lieu seul ne suffit pas). Quand tes lieux se partagent entre régions, le coach te les propose en boutons.
region_places_km = 50
# Ville : jamais verrouillée seule (un panneau « Pau 40 km » nomme un lieu où tu n'es pas) ; le coach la propose.
propose_city = true

[storage]
# Taille maximale des caches qui grossissent tout seuls (villages des pays rencontrés ; plus tard rues par ville
# et réponses Nominatim) : au-delà, les moins récemment utilisés sont supprimés. Le socle (répertoire GeoNames,
# guides Plonk It) ne part jamais tout seul ; ton jeu de test, tes metas et ta config ne sont jamais touchés.
max_cache_mb = 500

[debug]
# Mode débogage : un journal JSON de chaque analyse (pays StreetCLIP, zones, ce que l'IA a lu, marques et leurs
# découpes mark-<id>-<n>.png, étiquette « C'était où ? ») est écrit à côté de sa capture, capture-<id>.json,
# pour relire une manche après coup. Local, supprimé avec les anciennes captures.
enabled = false
