[vision]
enabled = true
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVAPI"    # variable lue dans l'environnement ou dans le .env du projet
model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
thinking = false         # raisonnement du modèle : plus lent, pas forcément plus juste
timeout_s = 90
max_tokens = 2000
temperature = 0.2
max_side_px = 1280       # l'image est réduite à cette taille avant l'envoi
prompt = '''
Tu es l'œil d'un coach GeoGuessr. Décris UNIQUEMENT ce qui est visible dans cette vue Street View,
sans deviner de pays ni de région. Réponds par un objet JSON valide, en français, avec ces clés :
- "sens_circulation": "droite" | "gauche" | "indéterminé" ; ne conclus que sur une preuve forte
  (véhicules EN MOUVEMENT, panneaux orientés, marquage), jamais sur des voitures garées
- "preuve_circulation": la preuve utilisée
- "marquage_routier": lignes (couleur, continues/discontinues, centrales/de rive) ou "aucun"
- "poteaux": matériau, forme, trous, marquages, couleurs
- "bornes_et_glissieres": bornes kilométriques, délinéateurs, glissières
- "panneaux_et_texte": textes lus mot pour mot, alphabet
- "plaques_immatriculation": couleurs, forme, bande latérale
- "architecture": style, toits, matériaux, clôtures
- "vegetation_et_sol": végétation reconnaissable, couleur du sol, climat apparent
- "relief": plat, collines, montagnes
- "camera_et_voiture_google": génération de caméra, partie visible du véhicule, antenne
- "autres_indices": tout autre détail discriminant
- "confiance": "faible" | "moyenne" | "élevée"
Si un élément n'est pas visible, écris "non visible". N'invente rien.
Ignore l'interface du jeu (boutons, boussole, carte, logos).
'''
