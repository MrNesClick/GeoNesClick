# Default configuration of GeoNesClick.
#
# DO NOT EDIT THIS FILE: override the keys you want in ~/.config/geonesclick/config.toml
# (same structure; only the keys present are replaced).

[server]
host = "127.0.0.1"   # never expose on the network: screen captures go through this server
port = 47615
# Origins allowed to connect (Tauri window in dev and in production).
allowed_origins = ["http://localhost:1420", "tauri://localhost", "http://tauri.localhost"]

[capture]
# What the GNOME picker offers to share: "window" (one window, recommended),
# "monitor" (a whole screen) or "both". After a change, delete
# ~/.config/geonesclick/screencast.token to choose again.
source = "window"
notify = true            # GNOME notification on each capture
sound = true             # shutter sound with the notification
save_to_disk = true      # keeps a PNG copy of each capture
directory = ""           # empty = ~/.local/share/geonesclick/captures/
keep_last = 200          # number of captures kept on disk (0 = unlimited)
# Analysed zone, as fractions of the captured image: [left, top, right, bottom].
# Empty = the window without the browser's bars: the coach finds where the page starts by comparing two captures,
# remembers it per window size (~/.config/geonesclick/page-top.json), and cuts 12 % of the top until then.
crop = []
# Masked zones (rectangles as fractions, relative to the analysed zone), e.g. the answer mini-map.
masks = []

[coach]
# Help level: what is shown on its own after a capture (can also be changed at the top of the coach).
#   1 = where to look        2 = + what the AI sees (including the text read)
#   3 = + likely countries, clues and Plonk It tips
#   4 = + synthesis at the top: country, region if a text names it, and the proof
help_level = 4
# Proof read with strong certainty (e.g. a "Provincia de Albacete" sign): this country goes first,
# "certain", and the others are ruled out; false = keep StreetCLIP's percentages only.
trust_proof = true
# The coach's language: en, fr (the whole UI); es, de, it, pt translate the Plonk It tips only (UI in English).
language = "en"
# Without proof read, a country is given as the answer only if it stands out: a probability of at least leader_min
# AND a leader_margin lead over the 2nd. Otherwise: "Hesitation" between the first ones (e.g. 22 %, 21 %, 16 %).
# Measured on the test set (spikes/coach_bench.py): 18 leaders out of 18 right from 70 %, 3 wrong out of 8 below.
leader_min = 0.70
leader_margin = 0.15

[dataset]
# Test set: "Where was it?" after the round saves the raw capture and the real country.
enabled = true
directory = ""           # empty = ~/.local/share/geonesclick/dataset/
ask_guessed = true       # also ask for the country you had answered (false = a simple "found?" Yes/No)
max_confusions = 3       # confusions shown with the metas that tell them apart (0 = hidden)

[metas]
enabled = true
include_seed = true      # seed of well-established facts (alphabets, driving side, lines), unverified
user_file = ""           # empty = ~/.config/geonesclick/my-metas.toml (your metas, take priority)
min_probability = 0.05   # candidate countries kept for the tie-break: above this threshold…
max_candidates = 5       # … and at most this number
max_categories = 3       # number of "where to look" categories shown
show_looks = true        # "Look at the colour of the centre line." instructions before revealing the countries
max_looks = 2            # instructions shown per category
judge_buttons = true     # "Right" / "Wrong" buttons on the seed clues
# Replace a category's instruction or weight (weight 0 = category ignored; "domains" is worth 0.5):
# category_looks = { poles = "the holes in the poles" }
# category_weights = { domains = 1.0 }
category_looks = {}
category_weights = {}

[plonkit]
# Plonk It guides (plonkit.net), collected politely on YOUR machine for your own use: the database is never
# redistributed. Built in the background on first start (~3 min), then only the modified guides
# are reloaded, at most every refresh_days days.
enabled = true
data_dir = ""            # empty = ~/.local/share/geonesclick/plonkit
refresh_days = 30
delay_s = 2.0            # pause between two pages (minimum 1 s)
similar_tips = true      # "the tips that look like your view" for each candidate country
similar_per_country = 2
# Ranking keywords for the tips per category (English), replacing the default ones:
# keywords = { poles = ["pole", "poles", "pylon"] }
keywords = {}
# The tips that neither the tags nor the keywords classify (~25 %) are handed to the AI, in batches,
# only once per text (result kept in cache). Only the known categories are accepted.
ai_classify = true
ai_model = ""            # empty = the level 2 model ([vision] model)
ai_batch = 25
ai_pause_s = 2.0
# The tips are in English: those displayed are translated on demand into the coach's language
# ([coach] language), by the same model, then kept in cache (a single translation per text and language).
translate = true
translate_timeout_s = 30  # a slower batch stays in English for this round (it will be translated again ahead of time)
# Translate the whole database ahead of time, in the background (batches of 10, ai_pause_s pause, after the running
# analyses): measured, 31 tips out of 4,060 cached, and 50 s to 2 min of waiting per round without it.
# Once and for all (resumes where it stopped); in the order of a few hours on the free tier.
pretranslate = true

[streetclip]
enabled = true
model = "geolocal/StreetCLIP"
# Pinned version: the one whose weights are in safetensors (no code run on load); only these files are
# downloaded (1.7 GB). Model licence: CC BY-NC 4.0 (non-commercial use).
revision = "adbc2bc00ccebc327500e42a973c98ed7c17b17a"
device = "auto"          # "auto", "cuda" or "cpu"
prompt = "A Street View photo in {}."
top_k = 5

exclude_countries = []   # remove countries from the list below, by code: ["RU", "UA"]

# Candidate countries: English name (used in the prompt) = ISO 3166-1 alpha-2 code (flag, metas).

[streetclip.countries]
Albania = "AL"
