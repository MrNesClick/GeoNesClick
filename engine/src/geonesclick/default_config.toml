[plonk]
# Cloud of the view's likely positions, drawn on the map (level 3 and up). PLONK (MIT) reads the vector
# already computed by StreetCLIP: +119 MB of video memory, ~0.75 s in the background. It only serves the map:
# measured, it does not pick the country better than StreetCLIP. Weights downloaded once (144 MB).
enabled = true
model = "nicolas-dufour/PLONK_OSV_5M"
revision = "e23229f4dd91d52560e8827f5bb2c68257fa162f"  # measured weights version (docs/benchmarks.md); change with model
steps = 50               # flow steps (10 to 250): 50 are enough, below 25 the cloud degrades
points = 512             # points sampled (64 to 2048)
# Zones drawn on the map: rounded outlines around the densest points of the cloud.
zone_share = 0.8         # the zones enclose the densest 80 % of the points
zone_link_km = 150       # two points less than 150 km apart belong to the same zone
zone_min_part = 0.05     # a zone must gather at least 5 % of the points to be shown

[map]
# Coach's map, from level 3: likely countries coloured, ruled-out countries greyed out, PLONK cloud.
# The background comes from an ONLINE tile server: it sees your IP address and the areas displayed. Offline,
# the map keeps the countries and the cloud, without a background.
enabled = true
# OpenStreetMap rules: https://operations.osmfoundation.org/policies/tiles/ (visible attribution, no
# downloading ahead of time). Another server: also allow it in the CSP (img-src) of
# app/src-tauri/tauri.conf.json, otherwise its tiles are blocked.
tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = "© OpenStreetMap"
attribution_url = "https://www.openstreetmap.org/copyright"
# CSS filter applied to the tiles for the coach's dark theme ("" = original map).
tile_filter = "invert(1) hue-rotate(180deg) saturate(0.35) brightness(0.85) contrast(0.9)"
# Up close, inversion makes forests, relief and village names unreadable (seen at zoom 13, in
# Béarn): from close_zoom on, original tiles barely dimmed so as not to dazzle ("" = original).
tile_filter_close = "brightness(0.9) contrast(0.95)"
close_zoom = 11
# Maximum zoom (2 to 19). 13: you see the streets and villages around a position estimated from your marks
# (direction sign, within ~2 km). Higher: more tiles loaded, and the server sees more precise areas.
# PLONK zones (~100 km) and countries are always framed from further away (zoom 8 at most).
max_zoom = 13

[vision]
enabled = true
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVAPI"    # name of the key: environment variable, else ~/.config/geonesclick/nvapi.key
model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
thinking = false         # model reasoning: slower, not necessarily more accurate
timeout_s = 90
max_tokens = 2000
temperature = 0.2
max_side_px = 1280       # the image is shrunk to this size before sending
# Measured prompt: making it longer degrades text reading ("Repkény utca" sign: 8 readings
# out of 10 with the French one, 4 out of 12 with extra instructions on the game's UI and unreadable text).
# This English version (spikes/prompt_bench.py) reads as well as the French one it replaces; keep it
# short, and measure again before changing it. {language}: the UI's language, for the free texts.
prompt = '''
You are the eye of a GeoGuessr coach. Describe ONLY what is visible in this Street View view.
Never guess a country from the landscape: only the "conclusion" key may name a place, and only
on explicit proof. Answer with a valid JSON object with these keys, the free texts in {language},
the listed values as they are:
- "driving_side": "right" | "left" | "unknown"; conclude only on strong proof
  (vehicles IN MOTION, oriented signs, markings), never on parked cars
- "driving_proof": the proof used
- "road_lines": lines (colour, solid/dashed, centre/edge)
- "poles": material, shape, holes, markings, colours
- "bollards_and_guardrails": kilometre markers, delineators, guardrails
- "signs_and_text": texts read word for word, alphabet
- "licence_plates": colours, shape, side band
- "architecture": style, roofs, materials, fences
- "vegetation_and_soil": recognisable vegetation, soil colour, apparent climate
- "relief": flat, hills, mountains
- "google_camera_and_car": camera generation, visible part of the vehicle, antenna
- "other_clues": any other discriminating detail
- "confidence": "low" | "medium" | "high"
- "conclusion": object {"country": ISO 3166-1 2-letter code, "region": region, province or city,
  "proof": the exact element that proves it, "certainty": "strong" | "medium"}; fill it ONLY if
  an explicit element designates the place (text read naming a place or an administration, domain name,
  phone code, flag, national plate); otherwise put "country": "", "region": "", "proof": "".
  The proof must be a text you read word for word in this image; if no text is legible, leave it all empty.
  A region name only counts if it is read; leave "region" empty if it is not written.
If an element is not visible, write "". Make nothing up.
Ignore the game's interface (buttons, compass, map, logos).
'''

[marks]
# Marks: Super+Shift+Z (or "Mark") freezes the view in full screen; you circle each clue (street sign,
# road sign, shop sign…); each is cropped from the RAW image, enlarged if small, then transcribed by the
# vision model. The marks complete the round's analysis: a capture is needed first.
enabled = true
max_marks = 9            # marks per frozen image (1 to 20)
# Measured: a 140×130 px Romanian sign read distorted as is, exact once enlarged ×3.
# The longest side of the crop is brought to upscale_to_px, without exceeding max_upscale times its size.
upscale_to_px = 420
max_upscale = 4.0
parallel = 3             # readings sent at the same time (free tier limits)
model = ""               # empty = the level 2 model ([vision] model)
max_tokens = 600
# The model only TRANSCRIBES: the coach draws the conclusions (local rules). Measured with spikes/prompt_bench.py:
# without the accents sentence, the English prompt dropped them (BÉARN → BEARN, HÔTEL → HOTEL).
prompt = '''
This image is an enlarged detail of a Street View view. Copy word for word all the visible text, letter for
letter as it is written: keep every accent and special letter (é, ô, ä, ø, ł, ș…), the alphabet and the capitals;
never translate, correct or complete a word. Answer with a valid JSON object:
- "text": list of the lines read; [] if there is no text
- "unreadable": true if text is visible but not readable, otherwise false
- "object": what the image shows, in a few words, in {language} (street sign, road sign, shop sign, licence plate, marker, pole…)
- "script": latin, cyrillic, greek, arabic, hebrew, thai, hangul, kana, chinese, devanagari, other, or ""
Make nothing up and name no country.
'''

[rules]
# Local rules: what the text of the marks proves. The model transcribes, the coach concludes, each rule sourced:
# - the alphabet rules out the countries that do not write it (Cyrillic excludes France);
# - a letter or a street word specific to a language ("ъ" before a consonant, "utca"): very likely country;
# - a place name (GeoNames): certain country if confirmed by another proof and no mark contradicts it.
scripts = true
letters = true
places = true
place_min_len = 4        # shorter place names ignored (acronyms, common words)
# GeoNames directory of the localities with more than 1,000 inhabitants (CC BY 4.0, ~11 MB), downloaded once at
# startup then indexed locally (~55 MB, 2.5 s).
places_url = "https://download.geonames.org/export/dump/cities1000.zip"
places_dir = ""          # empty = ~/.local/share/geonesclick/places
# The places read during a round are neighbours (a sign rarely announces further than 300 km): a namesake
# further from the group of the other places read is ignored. Measured: "LAAS", a French village missing from the
# directory, landed on Lasa (Italy, ~950 km from Orthez, read in the same round).
place_max_spread_km = 400
# A LONE place does not conclude (measured: Gare, Laas, Orion, Manto, four false leads in one day): it takes
# a 2nd nearby place, a letter or word of the country's language, or StreetCLIP giving that country prior_min or more.
prior_min = 0.10
# As soon as a country leads, its FULL directory (all inhabited places, villages included) is downloaded once
# (GeoNames: FR 7.3 MB, IT 4.4 MB, BG 0.8 MB) and added. GeoNames then sees which country is looked up.
detail = true
detail_url = "https://download.geonames.org/export/dump/{}.zip"
# Region names (~140 KB, once): region of each place, for the Region lock. Without them, the code is shown.
regions_url = "https://download.geonames.org/export/dump/admin1CodesASCII.txt"

[locks]
# Country › region › city locks, at the top of the coach: each locked level narrows down the search of the next one
# (places of the country, villages of the region). Independent opinions (StreetCLIP, the AI) stay visible, and a
# disagreement is flagged: that is what reveals a wrong lock. You can always reject a lock (✕) or set your own; the
# coach never replaces yours. They last one capture: a new capture resets everything.
enabled = true
auto_country = true      # country locked on its own when your marks make it CERTAIN (never on "very likely")
# Region locked on its own when the estimated position is a sharp point (sign with consistent distances) and
# all the places within region_radius_km of that point are in the same region.
auto_region = true
region_radius_km = 10
# Without a distance read: at least two places read, all in the same region and less than region_places_km apart
# (a lone place is not enough). When your places are split between regions, the coach offers them as buttons.
region_places_km = 50
# City: never locked on its own (a "Pau 40 km" sign names a place where you are not); the coach suggests it.
propose_city = true

[storage]
# Maximum size of the caches that grow on their own (villages of the countries met; later streets per city
# and Nominatim answers): beyond it, the least recently used are deleted. The base (GeoNames directory,
# Plonk It guides) never goes on its own; your test set, your metas and your config are never touched.
max_cache_mb = 500

[debug]
# Debug mode: a JSON log of each analysis (StreetCLIP countries, zones, what the AI read, marks and their
# crops mark-<id>-<n>.png, "Where was it?" label) is written next to its capture, capture-<id>.json,
# to replay a round afterwards. Local, deleted with old captures.
enabled = false
