# Configuration par défaut de GeoNesClick.
#
# NE PAS MODIFIER CE FICHIER : surcharge les clés voulues dans ~/.config/geonesclick/config.toml
# (même structure ; seules les clés présentes sont remplacées).

[server]
host = "127.0.0.1"   # ne jamais exposer sur le réseau : les captures d'écran transitent par ce serveur
port = 47615
# Origines autorisées à se connecter (fenêtre Tauri en dev et en production).
allowed_origins = ["http://localhost:1420", "tauri://localhost", "http://tauri.localhost"]

[capture]
# Ce que le sélecteur de GNOME propose de partager : "window" (une fenêtre, recommandé),
# "monitor" (un écran entier) ou "both". Après un changement, supprime
# ~/.config/geonesclick/screencast.token pour refaire le choix.
source = "window"
notify = true            # notification GNOME à chaque capture
sound = true             # son d'obturateur avec la notification
save_to_disk = true      # garde une copie PNG de chaque capture
directory = ""           # vide = engine/captures/
keep_last = 200          # nombre de captures conservées sur le disque (0 = illimité)
# Zone analysée, en fractions de l'image capturée : [gauche, haut, droite, bas].
# Vide = image entière. (La détection automatique de la vue Street View viendra plus tard.)
crop = []
# Zones masquées (rectangles en fractions, relatifs à la zone analysée), ex. la mini-carte de réponse.
masks = []

[coach]
# Niveau d'aide : ce qui s'affiche tout seul après une capture (modifiable aussi en haut du coach).
#   1 = où regarder          2 = + ce que voit l'IA (dont le texte lu)
#   3 = + pays probables, indices et astuces Plonk It
#   4 = + synthèse en tête : pays, région si un texte la nomme, et la preuve
help_level = 4
# Preuve lue avec certitude forte (ex. panneau « Provincia de Albacete ») : ce pays passe en tête,
# « certain », et les autres sont écartés ; false = garder les seuls pourcentages de StreetCLIP.
trust_proof = true
language = "fr"          # langue des traductions : fr, en, es, de, it, pt (l'interface suivra)

[dataset]
# Jeu de test : « C'était où ? » après la manche enregistre la capture brute et le pays réel.
enabled = true
directory = ""           # vide = engine/dataset/
ask_guessed = true       # demander aussi le pays que tu avais répondu (false = simple « trouvé ? » Oui/Non)
max_confusions = 3       # confusions affichées avec les metas qui les séparent (0 = masquées)

[metas]
enabled = true
include_seed = true      # amorce de faits très établis (alphabets, conduite, lignes), non vérifiée
user_file = ""           # vide = ~/.config/geonesclick/mes-metas.toml (tes metas, prioritaires)
min_probability = 0.05   # pays candidats retenus pour le départage : au-dessus de ce seuil…
max_candidates = 5       # … et au plus ce nombre
max_categories = 3       # nombre de catégories « où regarder » affichées
show_looks = true        # consignes « Regarde la couleur de la ligne centrale. » avant de révéler les pays
max_looks = 2            # consignes affichées par catégorie
judge_buttons = true     # boutons « Juste » / « Faux » sur les indices de l'amorce
# Remplacer la consigne ou le poids d'une catégorie (poids 0 = catégorie ignorée ; « domaine » vaut 0.5) :
# category_looks = { poteaux = "les trous dans les poteaux" }
# category_weights = { domaine = 1.0 }
category_looks = {}
category_weights = {}

[plonkit]
# Guides Plonk It (plonkit.net), collectés poliment sur TA machine pour ton usage : la base n'est jamais
# redistribuée. Construite en arrière-plan au premier démarrage (~3 min), puis seuls les guides modifiés
# sont rechargés, au plus tous les refresh_days jours.
enabled = true
data_dir = ""            # vide = ~/.local/share/geonesclick/plonkit
refresh_days = 30
delay_s = 2.0            # pause entre deux pages (minimum 1 s)
similar_tips = true      # « les astuces qui ressemblent à ta vue » pour chaque pays candidat
similar_per_country = 2
# Mots-clés de classement des astuces par catégorie (anglais), en remplacement de ceux par défaut :
# keywords = { poteaux = ["pole", "poles", "pylon"] }
keywords = {}
# Les astuces que ni les étiquettes ni les mots-clés ne classent (~25 %) sont confiées à l'IA, par lots,
# une seule fois par texte (résultat gardé en cache). Seules les catégories connues sont acceptées.
ai_classify = true
ai_model = ""            # vide = le modèle du niveau 2 ([vision] model)
ai_batch = 25
ai_pause_s = 2.0
# Les astuces sont en anglais : celles qui s'affichent sont traduites à la demande dans la langue du coach
# ([coach] language), par le même modèle, puis gardées en cache (une seule traduction par texte et langue).
translate = true

[streetclip]
enabled = true
model = "geolocal/StreetCLIP"
device = "auto"          # "auto", "cuda" ou "cpu"
prompt = "A Street View photo in {}."
top_k = 5

exclude_countries = []   # retirer des pays de la liste ci-dessous, par code : ["RU", "UA"]

# Pays candidats : nom anglais (utilisé dans le prompt) = code ISO 3166-1 alpha-2 (drapeau, metas).

