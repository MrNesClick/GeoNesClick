# Metas seed: only well-established facts (alphabets, driving side, colour of the centre lines, domains). Written by
# the assistant, NOT checked against a source: verified = false. It will be completed or replaced by a real metas
# source, and your own metas (~/.config/geonesclick/my-metas.toml) always come first.
#
# Format: [[meta]] id = <stable id, used by your verdicts>, category = <category>, countries = [2-letter ISO codes],
#          hint = "<clue>", look = "<what to observe, without naming a country>" (optional: otherwise, the category's
#          instruction). The texts are the English reference; their translations are in the catalogs
#          (locales/<lang>.json: seed.<id>.hint and seed.<id>.look); a text without a translation (a domain name) is the
#          same in every language.
# Categories: language, driving, road_lines, poles, bollards, plates, signs, domains, car, vegetation, architecture,
#             other

